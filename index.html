<script>
  // Public invite links: TestFlight External group, Firebase "testers" group.
  var IOS_URL = "https://testflight.apple.com/join/7NdwDcuv";
  var ANDROID_URL = "https://appdistribution.firebase.dev/i/20d06feae35edac9";

  var ua = navigator.userAgent || "";
  // iPadOS 13+ reports itself as a Mac, so a touch-capable "Macintosh" is an iPad.
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);

  // ?noredirect shows this page on any device instead of redirecting.
  var noRedirect = new URLSearchParams(location.search).has("noredirect");

  if (!noRedirect) {
    if (isIOS) location.replace(IOS_URL);
    else if (isAndroid) location.replace(ANDROID_URL);
  }

  // Phones hide the QR code (scanning it would only reopen this page);
  // tablets keep it so they can show it to someone else.
  var isPhone = /iPhone|iPod/i.test(ua) || (isAndroid && /Mobile/i.test(ua));
  if (isPhone) document.documentElement.className = "phone";

  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("ios").href = IOS_URL;
    document.getElementById("android").href = ANDROID_URL;
  });
</script>

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;

    background: var(--background); color: var(--ink);

    -webkit-font-smoothing: antialiased;
  }
  /* Narrow: one column, QR between the title and the buttons. */
  main {
    width: 100%; max-width: 380px; text-align: center;
    display: grid; grid-template-areas: "head" "scan" "actions";
  }
  .head { grid-area: head; }
  .scan { grid-area: scan; margin-bottom: 24px; }
  .actions { grid-area: actions; }
  .icon {
    width: 104px; height: 104px; border-radius: 23px; display: block; margin: 0 auto 20px;
    box-shadow: 0 1px 2px rgba(21, 35, 58, .12), 0 10px 28px rgba(200, 134, 42, .28);
  }
  h1 { margin: 0 0 6px; font-size: 32px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
  .lede { margin: 0 0 28px; color: var(--ink-mute); text-wrap: balance; }
  .card {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 20px;
    padding: 20px; box-shadow: 0 1px 2px rgba(21, 35, 58, .04), 0 8px 24px rgba(21, 35, 58, .06);
  }
  .qr { width: 220px; height: 220px; margin: 0 auto; padding: 10px; background: #fff; border-radius: 14px; border: 1px solid var(--rule); }
  .qr svg { display: block; width: 100%; height: 100%; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

  /* Wide: logo and buttons on the left, a larger QR code on the right. */
  @media (min-width: 760px) {
    main {
      max-width: 880px; column-gap: 56px; align-items: center;
      grid-template-columns: 340px auto;
      grid-template-areas: "head scan" "actions scan";
    }
    .head { align-self: end; }
    .actions { align-self: start; }
    h1 { font-size: 40px; }
    .scan { margin: 0; padding: 24px; }
    .qr { width: 440px; height: 440px; padding: 16px; }
    .divider { display: none; }
    .actions .btn:first-of-type { margin-top: 0; }
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 10px; padding: 14px 16px; border-radius: 14px;
    font-size: 16px; font-weight: 600; text-decoration: none;
    background: var(--ink-fixed); color: var(--on-ink-fixed);
    transition: transform .08s ease, opacity .15s ease;
  }
  .btn:hover { opacity: .92; }
  .btn:active { transform: scale(.98); }
  .btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  /* Dark mode: ochre primary on navy ink, as the app's Material scheme does. */
  @media (prefers-color-scheme: dark) {
    .btn { background: var(--ochre); color: var(--ink-fixed); }
    .btn.secondary { background: transparent; color: var(--ink); }
  }
  /* A phone viewing with ?noredirect has no use for a QR code to itself. */
  .phone .scan, .phone .divider { display: none; }
